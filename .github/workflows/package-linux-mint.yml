name: Linux package artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version from configure.in and CHANGELOG.md
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-package-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete release history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Validate selected release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          RELEASE_TAG="v${VERSION}"
          test "${GITHUB_REF}" = "refs/tags/v${VERSION}"
          test "${GITHUB_REF_TYPE}" = tag
          test "${GITHUB_REF_NAME}" = "${RELEASE_TAG}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          tools/check-release-version.sh "${VERSION}"

          if is_draft=$(gh release view "${RELEASE_TAG}" \
            --json isDraft --jq '.isDraft' 2>/dev/null); then
            if test "${is_draft}" != true; then
              printf 'Release %s is already published and immutable.\n' \
                "${RELEASE_TAG}" >&2
              exit 1
            fi
          fi

          mkdir -p release-inputs
          tools/extract-release-notes.sh \
            "${VERSION}" release-inputs/release-notes.md

      - name: Upload validated release inputs
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xmms-${{ inputs.version }}-release-inputs
          path: release-inputs/release-notes.md
          if-no-files-found: error
          retention-days: 30

  build-package:
    name: ${{ matrix.target_name }} amd64
    needs: [validate-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: linuxmint
            target_name: Linux Mint 22.3
            target_release: "22.3"
            target_codename: zena
            image: linuxmintd/mint22.3-amd64@sha256:f71f1a261ef2957022ae74ad2b89ebbc8fcb2f25e40d8d7cdb599aa9e2748a8e
            deb_distribution: zena
            deb_revision: 1~linuxmint22.3
            asset_suffix: linuxmint22.3
            expected_libc: "2.39"
            carry_source: true
          - target_id: ubuntu
            target_name: Ubuntu 26.04
            target_release: "26.04"
            target_codename: resolute
            image: ubuntu@sha256:7c2884fd32770fc6c173b78e0dc2278a2851d89f5447919edbc45475ac55dd6a
            deb_distribution: resolute
            deb_revision: 1~ubuntu26.04
            asset_suffix: ubuntu26.04
            expected_libc: "2.43"
            carry_source: false
    container:
      image: ${{ matrix.image }}
      options: --security-opt seccomp=unconfined
    env:
      TARGET_ID: ${{ matrix.target_id }}
      TARGET_NAME: ${{ matrix.target_name }}
      TARGET_RELEASE: ${{ matrix.target_release }}
      TARGET_CODENAME: ${{ matrix.target_codename }}
      BUILD_IMAGE: ${{ matrix.image }}
      DEB_DISTRIBUTION: ${{ matrix.deb_distribution }}
      DEB_REVISION: ${{ matrix.deb_revision }}
      ASSET_SUFFIX: ${{ matrix.asset_suffix }}
      EXPECTED_LIBC: ${{ matrix.expected_libc }}
      CARRY_SOURCE: ${{ matrix.carry_source }}

    steps:
      - name: Check out selected ref
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify package target
        shell: bash
        run: |
          set -euo pipefail
          case "${TARGET_ID}" in
            linuxmint)
              mint_sources=/etc/apt/sources.list.d/official-package-repositories.list
              test -r "${mint_sources}"
              awk -v codename="${TARGET_CODENAME}" '
                $1 == "deb" &&
                $2 ~ /^https?:\/\/packages\.linuxmint\.com\/?$/ &&
                $3 == codename { found = 1 }
                END { exit !found }
              ' "${mint_sources}"
              ;;
            ubuntu)
              test -r /etc/os-release
              # shellcheck disable=SC1091
              . /etc/os-release
              test "${ID}" = ubuntu
              test "${VERSION_ID}" = "${TARGET_RELEASE}"
              test "${VERSION_CODENAME}" = "${TARGET_CODENAME}"
              ;;
            *)
              printf 'Unsupported package target: %s\n' "${TARGET_ID}" >&2
              exit 1
              ;;
          esac
          test "$(dpkg --print-architecture)" = amd64

      - name: Install package build dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            cppcheck \
            debhelper-compat \
            dpkg-dev \
            file \
            gettext \
            libasound2-dev \
            libgl-dev \
            libgtk2.0-dev \
            libmikmod-dev \
            libsm-dev \
            libvorbis-dev \
            libxxf86vm-dev \
            lintian \
            pkg-config \
            xauth \
            xvfb \
            zlib1g-dev
          libc_version=$(dpkg-query -W -f='${Version}\n' libc6)
          case "${libc_version}" in
            "${EXPECTED_LIBC}"-*) ;;
            *)
              printf 'Unexpected libc6 version for %s: %s\n' \
                "${TARGET_NAME}" "${libc_version}" >&2
              exit 1
              ;;
          esac

      - name: Validate requested release version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tools/check-release-version.sh "${VERSION}"

      - name: Build target packages
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          touch aclocal.m4 configure config.h.in Makefile.in
          touch libxmms/aclocal.m4 libxmms/configure \
            libxmms/config.h.in libxmms/Makefile.in
          ./configure --disable-esd
          make dist-gzip
          mkdir -p release-artifacts/raw
          make \
            DEB_SOURCE_ARCHIVE="${GITHUB_WORKSPACE}/xmms-${VERSION}.tar.gz" \
            DEB_OUTPUT_DIR="${GITHUB_WORKSPACE}/release-artifacts/raw" \
            deb
          if test "${CARRY_SOURCE}" = true; then
            cp "xmms-${VERSION}.tar.gz" release-artifacts/
          fi

      - name: Name and inspect release artifacts
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for package in release-artifacts/raw/*.deb; do
            filename=$(basename "${package}")
            filename=${filename/"~${ASSET_SUFFIX}"/".${ASSET_SUFFIX}"}
            cp "${package}" "release-artifacts/${filename}"
          done
          rm -rf release-artifacts/raw

          runtime="release-artifacts/xmms_${VERSION}-1.${ASSET_SUFFIX}_amd64.deb"
          development="release-artifacts/libxmms-dev_${VERSION}-1.${ASSET_SUFFIX}_amd64.deb"
          test -f "${runtime}"
          test -f "${development}"
          test "$(dpkg-deb --field "${runtime}" Package)" = xmms
          test "$(dpkg-deb --field "${development}" Package)" = libxmms-dev
          test "$(dpkg-deb --field "${runtime}" Version)" = \
            "1:${VERSION}-${DEB_REVISION}"
          test "$(dpkg-deb --field "${runtime}" Architecture)" = amd64

          {
            printf 'XMMS version: %s\n' "${VERSION}"
            printf 'Source commit: %s\n' "${GITHUB_SHA}"
            printf 'Build image: %s\n' "${BUILD_IMAGE}"
            printf 'Target release: %s (%s)\n' \
              "${TARGET_RELEASE}" "${TARGET_CODENAME}"
            printf 'Build architecture: %s\n\n' "$(dpkg --print-architecture)"
            for package in "${runtime}" "${development}"; do
              printf '[%s]\n' "$(basename "${package}")"
              dpkg-deb --field "${package}" \
                Package Version Architecture Depends Recommends
              printf '\n'
            done
          } > release-artifacts/PACKAGE-METADATA.txt

      - name: Install and smoke-test packages
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          apt-get install -y \
            "./release-artifacts/xmms_${VERSION}-1.${ASSET_SUFFIX}_amd64.deb" \
            "./release-artifacts/libxmms-dev_${VERSION}-1.${ASSET_SUFFIX}_amd64.deb"
          test "$(xmms --version)" = "xmms ${VERSION}"
          test -f /usr/include/xmms/plugin.h

      - name: Generate checksums
        shell: bash
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          sha256sum ./*.deb > PACKAGES-SHA256SUMS
          checksum_inputs=(./*.deb PACKAGE-METADATA.txt)
          if compgen -G './*.tar.gz' >/dev/null; then
            checksum_inputs+=(./*.tar.gz)
          fi
          sha256sum "${checksum_inputs[@]}" > SHA256SUMS
          sha256sum --check PACKAGES-SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload target release artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xmms-${{ inputs.version }}-${{ matrix.asset_suffix }}-amd64
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  create-release:
    name: Create draft GitHub Release
    needs: [validate-release, build-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}
    steps:
      - name: Download validated release inputs
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: xmms-${{ inputs.version }}-release-inputs
          path: staging/release-inputs

      - name: Download Linux Mint packages
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: xmms-${{ inputs.version }}-linuxmint22.3-amd64
          path: staging/linuxmint22.3

      - name: Download Ubuntu packages
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: xmms-${{ inputs.version }}-ubuntu26.04-amd64
          path: staging/ubuntu26.04

      - name: Verify and assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          for target in linuxmint22.3 ubuntu26.04; do
            (
              cd "staging/${target}"
              sha256sum --check PACKAGES-SHA256SUMS
              sha256sum --check SHA256SUMS
            )
          done

          mkdir -p release-assets
          cp staging/linuxmint22.3/*.deb release-assets/
          cp staging/ubuntu26.04/*.deb release-assets/
          cp "staging/linuxmint22.3/xmms-${VERSION}.tar.gz" release-assets/
          cp staging/release-inputs/release-notes.md release-assets/
          cp staging/linuxmint22.3/PACKAGE-METADATA.txt \
            release-assets/PACKAGE-METADATA-linuxmint22.3.txt
          cp staging/ubuntu26.04/PACKAGE-METADATA.txt \
            release-assets/PACKAGE-METADATA-ubuntu26.04.txt
          cp staging/linuxmint22.3/PACKAGES-SHA256SUMS \
            release-assets/PACKAGES-SHA256SUMS-linuxmint22.3
          cp staging/ubuntu26.04/PACKAGES-SHA256SUMS \
            release-assets/PACKAGES-SHA256SUMS-ubuntu26.04

          {
            printf 'XMMS version: %s\n' "${VERSION}"
            printf 'Release tag: %s\n' "${RELEASE_TAG}"
            printf 'Source commit: %s\n' "${GITHUB_SHA}"
            printf 'Workflow run: https://github.com/%s/actions/runs/%s\n' \
              "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            printf 'Linux Mint image: %s\n' \
              'linuxmintd/mint22.3-amd64@sha256:f71f1a261ef2957022ae74ad2b89ebbc8fcb2f25e40d8d7cdb599aa9e2748a8e'
            printf 'Ubuntu image: %s\n' \
              'ubuntu@sha256:7c2884fd32770fc6c173b78e0dc2278a2851d89f5447919edbc45475ac55dd6a'
          } > release-assets/RELEASE-METADATA.txt

          (
            cd release-assets
            LC_ALL=C sha256sum \
              ./*.deb \
              ./*.tar.gz \
              PACKAGE-METADATA-linuxmint22.3.txt \
              PACKAGE-METADATA-ubuntu26.04.txt \
              PACKAGES-SHA256SUMS-linuxmint22.3 \
              PACKAGES-SHA256SUMS-ubuntu26.04 \
              RELEASE-METADATA.txt \
              release-notes.md > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Create or resume draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_assets=(release-assets/*)
          if is_draft=$(gh release view "${RELEASE_TAG}" \
            --json isDraft --jq '.isDraft' 2>/dev/null); then
            if test "${is_draft}" != true; then
              printf 'Release %s is already published and immutable.\n' \
                "${RELEASE_TAG}" >&2
              exit 1
            fi
            gh release upload "${RELEASE_TAG}" --clobber \
              "${release_assets[@]}"
            gh release edit "${RELEASE_TAG}" \
              --title "XMMS GTK2 ${VERSION}" \
              --notes-file release-assets/release-notes.md
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --draft \
              --title "XMMS GTK2 ${VERSION}" \
              --notes-file release-assets/release-notes.md \
              "${release_assets[@]}"
          fi
