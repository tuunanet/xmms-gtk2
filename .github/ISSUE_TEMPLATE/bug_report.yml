name: Bug report
description: Report a reproducible build or runtime problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not disclose security vulnerabilities here; follow SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure with …
        2. Run …
        3. Observe …
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA, branch, or release used
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and desktop
      placeholder: Ubuntu 24.04, X11, Xfce 4.18
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler and version
      placeholder: gcc 14.2.0
  - type: textarea
    id: configuration
    attributes:
      label: Configure command and plugin setup
      description: Include configure flags and relevant input/output plugins.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant build output, warnings, or crash details. Remove private data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not contain confidential security details.
          required: true
