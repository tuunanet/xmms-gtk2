core_value: >-
  Produce and publish trustworthy XMMS Linux packages whose compatibility,
  provenance, and release identity match their names.
summary: >-
  Extend the manually dispatched package workflow so one validated release tag
  builds amd64 runtime and development packages in both Linux Mint 22.3 and
  Ubuntu 26.04. Release assembly occurs only after both target builds pass their
  package, install, smoke-test, and checksum gates.

  The combined outputs become assets on a draft GitHub Release tied to the
  selected annotated version tag. A maintainer still reviews and publishes the
  draft manually.
in_scope:
  - id: e02s01
    outcome: Build, install, and upload Ubuntu 26.04 amd64 runtime and development DEBs.
  - id: e02s01
    outcome: Preserve the existing Linux Mint 22.3 package artifact contract.
  - id: e02s02
    outcome: Gate release assembly on successful Ubuntu and Linux Mint build artifacts.
  - id: e02s02
    outcome: Create or safely resume a draft GitHub Release with packages, source, notes, checksums, and provenance metadata.
  - id: e02s02
    outcome: Require a matching annotated version tag whose commit is contained in main.
out_of_scope:
  - item: Automatically publish a draft GitHub Release.
    reason: Maintainer review remains the final release-quality gate.
  - item: Replace assets on an already published GitHub Release.
    reason: Published releases are immutable project history.
  - item: Sign packages or release assets.
    reason: No package or artifact signing infrastructure is currently available.
  - item: Build non-amd64, LMDE, older Mint, or older Ubuntu packages.
    reason: Each additional target requires an independently verified userspace and compatibility contract.
  - item: Create or move a version tag from the workflow.
    reason: Maintainers must create the reviewed annotated tag before dispatch.
constraints:
  mint_target: Linux Mint 22.3 Zena amd64
  ubuntu_target: Ubuntu 26.04 LTS Resolute amd64
  package_format: Debian binary packages
  trigger: GitHub Actions workflow_dispatch only
  release_state: draft
  security: Pin container images and actions; grant contents write only to release assembly.
success_criteria:
  - A matching annotated vVERSION tag on main is validated before package builds.
  - Both targets build and install xmms and libxmms-dev packages in their claimed userspaces.
  - Downloadable DEB names identify linuxmint22.3 or ubuntu26.04 and amd64.
  - The release job runs only after both target variants succeed.
  - Downloaded artifact checksums are re-verified before release creation.
  - The draft Release contains four DEBs, one source archive, release notes, target metadata, and complete SHA-256 checksums.
  - A rerun may repair the same draft but cannot modify a published release.
references:
  - specs/IMPACT_LATEST.md
  - specs/tech-architecture/tech-stack.md
  - https://canonical.com/blog/canonical-releases-ubuntu-26-04-lts-resolute-raccoon
  - https://hub.docker.com/_/ubuntu
  - https://cli.github.com/manual/gh_release_create
